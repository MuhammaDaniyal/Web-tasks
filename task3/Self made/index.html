<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 400px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }

    /* Tab buttons */
    .tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 2px solid #eee;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 16px;
      color: #888;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }

    .tab.active {
      color: #4CAF50;
      border-bottom: 3px solid #4CAF50;
      font-weight: bold;
    }

    /* Forms */
    .form-section { display: none; }
    .form-section.active { display: block; }

    input {
      width: 100%;
      padding: 12px 16px;
      margin: 8px 0 16px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus { border-color: #4CAF50; }

    label { color: #555; font-size: 14px; }

    button.submit {
      width: 100%;
      padding: 13px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 4px;
    }

    button.submit:hover { background: #45a049; }

    /* Message box */
    .message {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      font-size: 15px;
      display: none;
    }

    .message.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .message.error   { background: #ffebee; color: #c62828; display: block; }

    /* Dashboard box */
    .dashboard {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .dashboard h2 { color: #333; margin-bottom: 10px; }
    .dashboard p  { color: #666; margin-bottom: 24px; }

    .dashboard .welcome {
      font-size: 22px;
      color: #4CAF50;
      font-weight: bold;
      margin-bottom: 8px;
    }

    button.logout {
      padding: 12px 30px;
      background: #e53935;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button.logout:hover { background: #c62828; }
  </style>
</head>
<body>

<div class="container">
  <h1>🔐 Login System</h1>

  <!-- TAB BUTTONS -->
  <div class="tabs" id="tabs">
    <button class="tab active" onclick="showTab('login')">Login</button>
    <button class="tab"        onclick="showTab('register')">Register</button>
  </div>

  <!-- LOGIN FORM -->
  <div class="form-section active" id="login">
    <label>Username</label>
    <input type="text" id="login-username" placeholder="Enter your username">

    <label>Password</label>
    <input type="password" id="login-password" placeholder="Enter your password">

    <button class="submit" onclick="doLogin()">Login</button>
  </div>

  <!-- REGISTER FORM -->
  <div class="form-section" id="register">
    <label>Username</label>
    <input type="text" id="reg-username" placeholder="Choose a username">

    <label>Password</label>
    <input type="password" id="reg-password" placeholder="Choose a password">

    <button class="submit" onclick="doRegister()">Register</button>
  </div>

  <!-- MESSAGE (success / error) -->
  <div class="message" id="message"></div>

  <!-- DASHBOARD (shown after login) -->
  <div class="dashboard" id="dashboard">
    <div class="welcome" id="welcome-text"></div>
    <p>You are logged in successfully!</p>
    <button class="logout" onclick="doLogout()">Logout</button>
  </div>
</div>

<script>
  // Switch between Login / Register tabs
  function showTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    event.target.classList.add('active');
    hideMessage();
  }

  function showMessage(text, type) {
    const box = document.getElementById('message');
    box.textContent = text;
    box.className = 'message ' + type;
  }

  function hideMessage() {
    document.getElementById('message').className = 'message';
  }

  // ── LOGIN ──────────────────────────────────────────
  async function doLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value.trim();

    if (!username || !password) {
      showMessage('Please fill in both fields', 'error');
      return;
    }

    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.ok) {
      // Hide forms, show dashboard
      document.getElementById('tabs').style.display = 'none';
      document.getElementById('login').style.display = 'none';
      document.getElementById('register').style.display = 'none';
      hideMessage();
      document.getElementById('welcome-text').textContent = `Welcome ${username} 👋`;
      document.getElementById('dashboard').style.display = 'block';
    } else {
      showMessage('❌ ' + data.message, 'error');
    }
  }

  // ── REGISTER ───────────────────────────────────────
  async function doRegister() {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value.trim();

    if (!username || !password) {
      showMessage('Please fill in both fields', 'error');
      return;
    }

    const res = await fetch('/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.ok) {
      showMessage('✅ ' + data.message + ' — You can now login!', 'success');
    } else {
      showMessage('❌ ' + data.message, 'error');
    }
  }

  // ── LOGOUT ─────────────────────────────────────────
  async function doLogout() {
    await fetch('/logout');

    // Show login form again
    document.getElementById('tabs').style.display = 'flex';
    document.getElementById('login').style.display = 'block';
    document.getElementById('login').classList.add('active');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-username').value = '';
    document.getElementById('login-password').value = '';
    showMessage('✅ Logout successful', 'success');
  }
</script>

</body>
</html>
